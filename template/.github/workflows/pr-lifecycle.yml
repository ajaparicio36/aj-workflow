name: pr-lifecycle

# Called from each code repo's ticket-status.yml on pull_request events.
# Moves the hub ticket: PR open -> In Review, draft/closed -> In Progress, merged -> Done.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ticket-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: acme/acme-kb
          ref: main
          token: ${{ secrets.KB_BOT_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync ticket status from PR
        run: node tools/ticket-sync/main.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KB_BOT_TOKEN: ${{ secrets.KB_BOT_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
