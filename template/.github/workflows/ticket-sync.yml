name: ticket-sync

# Hub issue -> labels, Project board, Jira, per-repo branches. See docs/workflow.md.
on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled]

permissions:
  issues: write
  contents: read

concurrency:
  group: ticket-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sync ticket
        run: node tools/ticket-sync/main.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KB_BOT_TOKEN: ${{ secrets.KB_BOT_TOKEN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          KB_PROJECT_NUMBER: ${{ vars.KB_PROJECT_NUMBER }}
