name: ticket-status

# kb tickets can name repo:kb, so kb PRs move hub tickets too. Same as kit/github/ticket-status.yml,
# but calls the reusable workflow locally.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

jobs:
  ticket:
    # forks and Dependabot get no secrets
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/pr-lifecycle.yml
    secrets: inherit
