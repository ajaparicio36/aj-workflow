name: Bug
description: Something is broken.
labels: ["status:todo", "type:fix"]
body:
  - type: dropdown
    id: repos
    attributes:
      label: Repos
      multiple: true
      options: [app, web, kb]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [p2, p1]
      default: 0
  - type: textarea
    id: why
    attributes:
      label: What happens
      description: Observed behaviour, with screenshots or logs.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The expected behaviour, as checkable conditions.
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      placeholder: "~2h"
    validations:
      required: true
